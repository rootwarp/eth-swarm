# PR gate: contracts, dependency policy, workflow hardening, build, lint and tests.
# Hardening (enforced by scripts/check-workflows.sh): pull_request trigger only, top-level
# read-only token, every action pinned to a full commit SHA, no secrets. Nothing is restored
# from a cache: spec vectors are fetched fresh and hash-checked on every run.
name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  workflows:
    name: workflow hardening
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - run: bash scripts/check-workflows.sh
      - name: Every cargo command in a CI run step uses --locked
        run: bash scripts/tests/check-locked.test.sh && bash scripts/check-locked.sh
      - name: Reference node (Sepolia, Hoodi) scripts and compose file (offline, stub commands)
        run: bash ops/ref-node/tests/ref-node.test.sh
      - name: Arrival collector systemd template and per-network env examples (offline)
        run: bash ops/collector/tests/collector-unit.test.sh
      - name: Kurtosis devnet images pinned by tag and digest (testing/kurtosis/*.yaml)
        run: bash scripts/check-kurtosis-pins.sh
      - name: Kurtosis devnet checker (offline, stub kurtosis and curl)
        run: bash testing/kurtosis/tests/check-devnet.test.sh
      - name: Probe systemd units (own user, nodekey credential, anchor check, hardening)
        run: bash ops/probe/tests/probe-units.test.sh

  proto:
    name: buf lint, build, breaking vs develop, baseline drift
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # buf breaking needs refs/remotes/origin/develop
      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          setup_only: true
          version: 1.74.0
          checksum: 92326d957d613712669fb55f9e4340946a8142a92120e09008459118778273d2 # buf-Linux-x86_64
      - name: buf lint and build
        working-directory: proto
        run: buf lint && buf build
      - name: buf breaking against develop
        run: bash scripts/buf-breaking.sh refs/remotes/origin/develop
      - name: Committed baseline matches a fresh buf build
        run: bash scripts/check-proto-baseline.sh
      - name: Baseline drift check tests
        run: bash scripts/tests/check-proto-baseline-test.sh

  policy:
    name: cargo deny (and its negative test), ssz and libp2p revs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - run: cargo deny --locked check
      - run: bash scripts/check-ssz-revs.sh
      - name: Every libp2p* crate from one rust-libp2p commit that has the StrictNoSign key rejection
        run: bash scripts/tests/check-libp2p-revs.test.sh && bash scripts/check-libp2p-revs.sh
      # Runs on every PR, so on every change to Cargo.toml, Cargo.lock or deny.toml.
      - name: cargo deny fails on a second libp2p* version (dev-only too) and on a git source outside allow-git
        run: bash scripts/tests/check-deny-negative.test.sh && bash scripts/check-deny-negative.sh

  rust:
    name: fmt, clippy, build, test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Vector sets the spec-tests `vectors` target must find and run (crates/spec-tests/README.md).
      SPEC_SETS: ssz-specs general minimal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - name: Install protoc (ethswarm-proto build.rs runs tonic-prost-build)
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: protoc@3.36.2
          fallback: none
      - run: cargo fmt --all -- --check
      - run: cargo build --workspace --locked
      - name: crypto-kzg uses only its pinned setup loader; blst is not portable
        run: bash scripts/tests/check-kzg-loaders.test.sh && bash scripts/check-kzg-loaders.sh
      - name: cl-verify is the only load_pinned caller, with the beta.4 mainnet digest
        run: bash scripts/tests/check-setup-pin.test.sh && bash scripts/check-setup-pin.sh
      - name: Only cl-verify's own tests enable cl-verify/test-backends
        run: bash scripts/tests/check-test-backends.test.sh && bash scripts/check-test-backends.sh
      - name: Only spec-tests may enable crypto-bls/test-vectors
        run: bash scripts/check-bls-features.sh
      - name: cl-chain links only crypto-bls/aggregate, never crypto-bls/verify
        run: bash scripts/tests/check-cl-chain-features.test.sh && bash scripts/check-cl-chain-features.sh
      - name: cl-chain builds on its own (no feature unification with spec-tests)
        run: cargo check -p cl-chain --all-targets --locked
      - name: No dependency cycles among workspace crates (cargo metadata, every edge kind)
        run: bash scripts/tests/check-dep-cycles.test.sh && bash scripts/check-dep-cycles.sh
      - name: m2a-session links no discv5 and no store crate (one pinned peer, blocks dropped)
        run: bash scripts/tests/check-m2a-deps.test.sh && bash scripts/check-m2a-deps.sh
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Fetch and verify spec vectors (uncached)
        run: PRESETS="general minimal" bash testing/fetch-vectors.sh
      - run: cargo test --workspace --locked
      - name: Every service runs the contract suite, in process and over UDS
        run: bash scripts/tests/check-contract-tests.test.sh && bash scripts/check-contract-tests.sh
      - name: crypto-bls API tests with every feature (verify, aggregate, test-vectors)
        run: cargo test -p crypto-bls --all-features --locked
      - name: crypto-bls feature gate (aggregate only, trybuild)
        run: cargo test -p crypto-bls --no-default-features --features aggregate --test compile_fail --locked

  fuzz-build:
    # The req/resp decoder fuzz targets (fuzz/, its own workspace and Cargo.lock) build as the
    # gate runs them, on the nightly pinned in fuzz/rust-toolchain.toml. cargo-fuzz has no
    # --locked: fuzz/build-m2a.sh runs `cargo metadata --locked` first and fails if the build
    # touched fuzz/Cargo.lock. The fuzzing itself (fuzz/run-m2a-gate.sh, 1 h per target) is not
    # run here.
    name: fuzz targets build, seed corpus, gate scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned nightly (fuzz/rust-toolchain.toml)
        working-directory: fuzz
        run: rustup toolchain install && rustc --version
      - name: Install protoc (ethswarm-proto build.rs runs tonic-prost-build)
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: protoc@3.36.2
          fallback: none
      - name: Install cargo-fuzz (pinned)
        working-directory: fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: fuzz/Cargo.lock resolves every shared crate exactly as Cargo.lock does
        run: bash scripts/tests/check-fuzz-lock.test.sh && bash scripts/check-fuzz-lock.sh
      - name: Build the four targets as the gate runs them
        run: bash fuzz/build-m2a.sh
      - name: Seed corpus is what fuzz/gen-seeds.sh builds and runs clean under every target
        working-directory: fuzz
        run: cargo test --locked
      - name: Gate runner and gate file checker
        run: bash scripts/tests/run-m2a-gate.test.sh && bash scripts/tests/check-m2a-gate.test.sh

  root-tests:
    # Tests that need more than one UID: file owner checks, and the Unix-socket peer checks
    # (counterfeit server, wrong-UID caller, foreign stale socket, socket directory owner and
    # group). The container runs as root and three throwaway users supply the other UIDs: chain
    # (the allowed caller), api (in the socket group, not allowed on every method) and other
    # (outside the group). ETHSWARM_ROOT_TESTS=1 makes those cases fail instead of skip if
    # root or a user is missing.
    name: multi-UID tests as root
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: rust:1.99.0-bookworm@sha256:114c7a4425406451c2866b6aafe69fe29b1b298832db1277d411ac73c82d04d6 # 1.99.0-bookworm
      options: --user 0
    env:
      ETHSWARM_ROOT_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Running as root
        run: test "$(id -u)" -eq 0
      - name: Create three throwaway users
        run: |
          for user in other chain api; do
            useradd --no-create-home --user-group --shell /usr/sbin/nologin "ethswarm-$user"
            upper=$(echo "$user" | tr '[:lower:]' '[:upper:]')
            echo "ETHSWARM_${upper}_UID=$(id -u "ethswarm-$user")" >> "$GITHUB_ENV"
            echo "ETHSWARM_${upper}_GID=$(id -g "ethswarm-$user")" >> "$GITHUB_ENV"
          done
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - name: Install protoc (ethswarm-proto build.rs runs tonic-prost-build)
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: protoc@3.36.2
          fallback: none
      - name: Pubkey cache owner and mode tests
        run: cargo test -p cl-verify-cache --test persist --locked
      - name: Peer credentials, socket directory and stale-socket tests
        run: cargo test -p ipc --test peercred --locked
      - name: Method ACL against cl-engine and the SIGTERM drain
        run: cargo test -p svc-runtime --locked

  credential-root-tests:
    # The node-key credential shapes as systemd leaves them: a tmpfs at /run/credentials/<unit>,
    # a root-owned 0400 file with an ACL read grant (and the chown fallback), remounted
    # read-only, loaded on a thread that runs as the service's user. mount needs CAP_SYS_ADMIN,
    # so this throwaway container is privileged; nothing else runs in it. The runner's kernel
    # has POSIX ACLs on tmpfs, so ETHSWARM_REQUIRE_TMPFS_ACL=1 makes that part mandatory.
    name: node-key credential on a read-only tmpfs as root
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: rust:1.99.0-bookworm@sha256:114c7a4425406451c2866b6aafe69fe29b1b298832db1277d411ac73c82d04d6 # 1.99.0-bookworm
      options: --user 0 --privileged
    env:
      ETHSWARM_ROOT_TESTS: "1"
      ETHSWARM_REQUIRE_TMPFS_ACL: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Running as root
        run: test "$(id -u)" -eq 0
      - name: Install setfacl and create the service user
        run: |
          apt-get update && apt-get install -y --no-install-recommends acl
          useradd --no-create-home --user-group --shell /usr/sbin/nologin ethswarm-other
          echo "ETHSWARM_OTHER_UID=$(id -u ethswarm-other)" >> "$GITHUB_ENV"
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - name: Credential shapes, ACL decoding and log hygiene
        run: cargo test -p node-key --locked
