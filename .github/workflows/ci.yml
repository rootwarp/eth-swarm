# PR gate: contracts, dependency policy, workflow hardening, build, lint and tests.
# Hardening (enforced by scripts/check-workflows.sh): pull_request trigger only, top-level
# read-only token, every action pinned to a full commit SHA, no secrets. Nothing is restored
# from a cache: spec vectors are fetched fresh and hash-checked on every run.
name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  workflows:
    name: workflow hardening
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - run: bash scripts/check-workflows.sh
      - name: Every cargo command in a CI run step uses --locked
        run: bash scripts/tests/check-locked.test.sh && bash scripts/check-locked.sh

  proto:
    name: buf lint, build, breaking vs develop, baseline drift
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # buf breaking needs refs/remotes/origin/develop
      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          setup_only: true
          version: 1.74.0
          checksum: 92326d957d613712669fb55f9e4340946a8142a92120e09008459118778273d2 # buf-Linux-x86_64
      - name: buf lint and build
        working-directory: proto
        run: buf lint && buf build
      - name: buf breaking against develop
        run: bash scripts/buf-breaking.sh refs/remotes/origin/develop
      - name: Committed baseline matches a fresh buf build
        run: bash scripts/check-proto-baseline.sh
      - name: Baseline drift check tests
        run: bash scripts/tests/check-proto-baseline-test.sh

  policy:
    name: cargo deny, ssz revs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - run: cargo deny --locked check
      - run: bash scripts/check-ssz-revs.sh

  rust:
    name: fmt, clippy, build, test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Vector sets the spec-tests `vectors` target must find and run (crates/spec-tests/README.md).
      SPEC_SETS: ssz-specs general minimal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - name: Install protoc (cl-verify build.rs runs tonic-build)
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: protoc@3.36.2
          fallback: none
      - run: cargo fmt --all -- --check
      - run: cargo build --workspace --locked
      - name: crypto-kzg uses only its pinned setup loader; blst is not portable
        run: bash scripts/tests/check-kzg-loaders.test.sh && bash scripts/check-kzg-loaders.sh
      - name: cl-verify is the only load_pinned caller, with the beta.4 mainnet digest
        run: bash scripts/tests/check-setup-pin.test.sh && bash scripts/check-setup-pin.sh
      - name: Only cl-verify's own tests enable cl-verify/test-backends
        run: bash scripts/tests/check-test-backends.test.sh && bash scripts/check-test-backends.sh
      - name: Only spec-tests may enable crypto-bls/test-vectors
        run: bash scripts/check-bls-features.sh
      - name: cl-chain links only crypto-bls/aggregate, never crypto-bls/verify
        run: bash scripts/tests/check-cl-chain-features.test.sh && bash scripts/check-cl-chain-features.sh
      - name: No dependency cycles among workspace crates (cargo metadata, every edge kind)
        run: bash scripts/tests/check-dep-cycles.test.sh && bash scripts/check-dep-cycles.sh
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Fetch and verify spec vectors (uncached)
        run: PRESETS="general minimal" bash testing/fetch-vectors.sh
      - run: cargo test --workspace --locked
      - name: crypto-bls API tests with every feature (verify, aggregate, test-vectors)
        run: cargo test -p crypto-bls --all-features --locked
      - name: crypto-bls feature gate (aggregate only, trybuild)
        run: cargo test -p crypto-bls --no-default-features --features aggregate --test compile_fail --locked

  root-tests:
    # Tests that need a second UID (file owner checks; later peercred). The container runs as
    # root, a throwaway user supplies the second UID, and ETHSWARM_ROOT_TESTS=1 makes those
    # cases fail instead of skip if either is missing.
    name: multi-UID tests as root
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: rust:1.99.0-bookworm@sha256:114c7a4425406451c2866b6aafe69fe29b1b298832db1277d411ac73c82d04d6 # 1.99.0-bookworm
      options: --user 0
    env:
      ETHSWARM_ROOT_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Running as root
        run: test "$(id -u)" -eq 0
      - name: Create a throwaway second user
        run: |
          useradd --no-create-home --shell /usr/sbin/nologin ethswarm-other
          echo "ETHSWARM_OTHER_UID=$(id -u ethswarm-other)" >> "$GITHUB_ENV"
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - name: Pubkey cache owner and mode tests
        run: cargo test -p cl-verify-cache --test persist --locked
