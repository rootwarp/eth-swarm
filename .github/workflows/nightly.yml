# Nightly, uncached: re-fetch every manifest source (all presets and optional assets), re-check
# every tag -> commit pin and sha256, run the full vector suite, re-run the dependency policy
# against today's advisory database, and run fuzz gate 1 (seven decoder targets, an hour each),
# fuzz gate 2a (the three column decoder targets, an hour each) and fuzz gate 2b (the column
# handler target, an hour). Also runnable by hand via workflow_dispatch. A push to
# fuzz-gate/** runs the same jobs. The push trigger exists because workflow_dispatch
# only works when this file is on the default branch; a push reads the workflow from
# the pushed branch.
name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: ['fuzz-gate/**']

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  vectors:
    name: fetch every manifest source, full vector suite
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # Every set is required: mainnet ssz_static, bls (bls12-381-tests, cryptography-specs,
      # general) and kzg (cryptography-specs) run, and comptests is scanned, with the coverage
      # guard on.
      SPEC_SETS: ssz-specs general minimal mainnet comptests cryptography-specs bls12-381-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space for the full vector set (archives are kept for re-hashing)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc && df -h .
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - name: Install protoc (ethswarm-proto build.rs runs tonic-prost-build)
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: protoc@3.36.2
          fallback: none
      - name: Fetch and verify every manifest source (no cache, no PRESETS filter)
        run: INCLUDE_OPTIONAL=1 bash testing/fetch-vectors.sh
      - name: Disk usage
        run: du -sh target/spec-vectors/*/* && df -h .
      - name: Workspace tests (debug; the full vector sets run once, below, in release)
        run: cargo test --workspace --locked
        env:
          SPEC_SETS: ssz-specs general minimal
      - run: cargo test -p spec-tests --release --locked --test vectors

  policy:
    name: cargo deny, ssz and libp2p revs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - run: cargo deny --locked check
      - run: bash scripts/check-ssz-revs.sh
      - run: bash scripts/check-libp2p-revs.sh

  fuzz-gate1:
    # Fuzz gate 1 (fuzz/run-gate1.sh): rpc_chunk, gossip_transform, message_id, enr_fields and the
    # control decoders status_v2, metadata_v3 and ping_goodbye, each fuzzed for 3600 s from the
    # committed bomb seeds, in parallel, under the gate's limits (-rss_limit_mb=2048,
    # -malloc_limit_mb=128, -timeout=10, the per-target -max_len; fuzz/m2a-common.sh). The gate
    # file records the commit, each target's seconds, executions, crashes, OOMs, timeouts and
    # seed-corpus sha256, and must pass fuzz/check-gate1.sh. The file, its log and any crash
    # inputs are kept as the run's artifact.
    name: fuzz gate 1, seven targets x 1 h
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned nightly (fuzz/rust-toolchain.toml)
        working-directory: fuzz
        run: rustup toolchain install && rustc --version
      - name: Install protoc (ethswarm-proto build.rs runs tonic-prost-build)
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: protoc@3.36.2
          fallback: none
      - name: Install cargo-fuzz (pinned)
        working-directory: fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      # Online, so it fetches the locked sources the gate's offline lock check then needs.
      - name: fuzz/Cargo.lock resolves every shared crate exactly as Cargo.lock does
        run: bash scripts/check-fuzz-lock.sh
      - name: Run gate 1 (3600 s per target)
        run: unset PROTOC && bash fuzz/run-gate1.sh
      - name: The gate file passes the checker
        run: bash fuzz/check-gate1.sh fuzz/artifacts/gate1.json
      - name: Gate file and log
        if: always()
        run: cat fuzz/artifacts/gate1.json fuzz/artifacts/gate1.log
      - name: Keep the gate file, its log and any crash inputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-gate1-${{ github.sha }}
          path: fuzz/artifacts/
          if-no-files-found: error
          retention-days: 30

  fuzz-gate2a:
    # Fuzz gate 2a (fuzz/run-gate2a.sh): data_column_sidecar (the Gloas DataColumnSidecar as
    # gossip and as a response chunk of both column protocols, on the pinned Sepolia blob
    # schedule's caps), columns_by_range_req and columns_by_root_req (the column requests and
    # their admission check), each fuzzed for 3600 s from the committed oversize and bomb seeds,
    # in parallel, under the gate's limits (-rss_limit_mb=2048, -malloc_limit_mb=128,
    # -timeout=10, the per-target -max_len; fuzz/m2a-common.sh). The gate file records the
    # commit, each target's seconds, executions, crashes, OOMs, timeouts and seed-corpus sha256,
    # and must pass fuzz/check-gate2a.sh. The file, its log and any crash inputs are kept as the
    # run's artifact.
    name: fuzz gate 2a, three column targets x 1 h
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned nightly (fuzz/rust-toolchain.toml)
        working-directory: fuzz
        run: rustup toolchain install && rustc --version
      - name: Install protoc (ethswarm-proto build.rs runs tonic-prost-build)
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: protoc@3.36.2
          fallback: none
      - name: Install cargo-fuzz (pinned)
        working-directory: fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      # Online, so it fetches the locked sources the gate's offline lock check then needs.
      - name: fuzz/Cargo.lock resolves every shared crate exactly as Cargo.lock does
        run: bash scripts/check-fuzz-lock.sh
      - name: Run gate 2a (3600 s per target)
        run: unset PROTOC && bash fuzz/run-gate2a.sh
      - name: The gate file passes the checker
        run: bash fuzz/check-gate2a.sh fuzz/artifacts/gate2a.json
      - name: Gate file and log
        if: always()
        run: cat fuzz/artifacts/gate2a.json fuzz/artifacts/gate2a.log
      - name: Keep the gate file, its log and any crash inputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-gate2a-${{ github.sha }}
          path: fuzz/artifacts/
          if-no-files-found: error
          retention-days: 30

  fuzz-gate2b:
    # Fuzz gate 2b (fuzz/run-gate2b.sh): column_contract, cl-chain's storage contract, column
    # store and column RPCs driven with sequences of gossip sidecars and range and root requests
    # (a temp column env per input, a stub reference and a stub cl-verify), fuzzed for 3600 s
    # from gate 2a's seeds and the negative serving cases, under the gate's limits
    # (-rss_limit_mb=2048, which covers the column env's map, -malloc_limit_mb=128, -timeout=10,
    # the target's -max_len; fuzz/m2a-common.sh). A sidecar the contract rejected appearing in an
    # answer, or any other broken invariant, is a crash. The gate file records the commit, the
    # target's seconds, executions, crashes, OOMs, timeouts and seed-corpus sha256, and must pass
    # fuzz/check-gate2b.sh. The file, its log and any crash inputs are kept as the run's
    # artifact.
    name: fuzz gate 2b, the column handler target x 1 h
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned nightly (fuzz/rust-toolchain.toml)
        working-directory: fuzz
        run: rustup toolchain install && rustc --version
      - name: Install protoc (ethswarm-proto build.rs runs tonic-prost-build)
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: protoc@3.36.2
          fallback: none
      - name: Install cargo-fuzz (pinned)
        working-directory: fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      # Online, so it fetches the locked sources the gate's offline lock check then needs.
      - name: fuzz/Cargo.lock resolves every shared crate exactly as Cargo.lock does
        run: bash scripts/check-fuzz-lock.sh
      - name: Run gate 2b (3600 s)
        run: unset PROTOC && bash fuzz/run-gate2b.sh
      - name: The gate file passes the checker
        run: bash fuzz/check-gate2b.sh fuzz/artifacts/gate2b.json
      - name: Gate file and log
        if: always()
        run: cat fuzz/artifacts/gate2b.json fuzz/artifacts/gate2b.log
      - name: Keep the gate file, its log and any crash inputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-gate2b-${{ github.sha }}
          path: fuzz/artifacts/
          if-no-files-found: error
          retention-days: 30
