syntax = "proto3";

package ethswarm.common.v1;

// Gossipsub validation result. Timeout or overload => VERDICT_IGNORE, never VERDICT_ACCEPT.
// VERDICT_UNSPECIFIED (0) is a contract error (ERROR_CODE_CONTRACT_VIOLATION); it is never treated as ACCEPT.
enum Verdict {
  VERDICT_UNSPECIFIED = 0;
  VERDICT_ACCEPT = 1;
  VERDICT_REJECT = 2;
  VERDICT_IGNORE = 3;
}
