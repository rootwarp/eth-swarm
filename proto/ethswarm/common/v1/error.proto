syntax = "proto3";

package ethswarm.common.v1;

enum ErrorCode {
  // Never valid on the wire: receiving it is ERROR_CODE_CONTRACT_VIOLATION.
  ERROR_CODE_UNSPECIFIED = 0;
  // Digest not in the ForkSchedule, or does not match the fork of the object's slot. Contract error: drop and log.
  ERROR_CODE_FORK_DIGEST_MISMATCH = 1;
  ERROR_CODE_SSZ_DECODE = 2;
  ERROR_CODE_NOT_FOUND = 3;
  ERROR_CODE_RESOURCE_UNAVAILABLE = 4;
  ERROR_CODE_OVERLOADED = 5;
  ERROR_CODE_NOT_SYNCED = 6;
  ERROR_CODE_ENGINE_UNAVAILABLE = 7;
  ERROR_CODE_INVALID = 8;
  ERROR_CODE_DEADLINE_EXCEEDED = 9;
  ERROR_CODE_VERSION_MISMATCH = 10;
  // Sender broke the contract, e.g. sent the zero (UNSPECIFIED) value of any enum. Receiver logs it, increments
  // the contract-violation metric, and fails the call or stream with this code.
  ERROR_CODE_CONTRACT_VIOLATION = 11;
}

message Error {
  ErrorCode code = 1;
  // Human-readable detail. Max 1024 bytes (operational: enough for a rule id + context; longer strings are truncated by the sender, rejected as CONTRACT_VIOLATION by the receiver). Must not contain raw peer payload bytes.
  string detail = 2;
}
