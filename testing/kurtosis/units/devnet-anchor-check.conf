# ETH Swarm devnet only: a drop-in that testing/kurtosis/run-units.sh installs for each of the
# three probe units, as /etc/systemd/system/<unit>.service.d/devnet-anchor-check.conf. It is a
# recorded devnet deviation (testing/kurtosis/README.md, "Probe units under systemd"):
#   --allow-insecure-http  the devnet's beacon APIs are plain http:// on the enclave network;
#   --preset minimal       the devnet runs the minimal preset, and anchor-fetch decodes the
#                          anchor by the mainnet preset unless told otherwise.
# The check itself does not change: two providers (here the two reference CLs) must agree on the
# finalized block root, its header's state_root and the state root, or the unit does not start.
# run-units.sh refuses to start unless this line is each unit's own ExecStartPre= with only those
# two flags added, and unless this file holds nothing else but the reset and the rate limit.
# LogRateLimitIntervalSec=0 turns journald's rate limit off for the unit, so the journal that the
# run greps holds every line; the run also fails on a "Suppressed" line of journald.
# Never install it on a probe host: #38's host check requires that no drop-in exists.
[Service]
ExecStartPre=
ExecStartPre=/usr/local/bin/anchor-fetch --providers ${ANCHOR_PROVIDERS} --allow-insecure-http --preset minimal --check
LogRateLimitIntervalSec=0
