# Skip list for crates/spec-tests (schema: testing/skip.toml.example).
# The run FAILS on any case that is neither run nor matched here, on an expired entry,
# and on an entry that matches no file in a vector set that was scanned (stale).
# The coverage guard also FAILS the run on any vector file that no handler read, unless its
# case is skipped here or a `file` entry excuses it.
#
# The first matching entry gives a case its reason, so narrow groups come before the
# fork-wide ones. `issue` is the plan item whose work removes the entry, or "none" when no
# plan item will. Every entry expires on the M1 deadline, 2026-11-30.
#
# After every manifest bump: run all seven sets guarded (testing/README.md, "Skip list"),
# delete each entry reported stale, and add an entry with a reason for each new unaccounted
# case or unread file.

