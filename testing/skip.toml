# ---------------------------------------------------------------------------------------
# Fork choice. crates/spec-tests/src/fork_choice.rs runs the Gloas handlers on_block,
# get_head, get_parent_payload_status and filter_node_tree_variants with tick and block steps
# and store checks only, and it fails closed on any other step or check. The case globs
# below skip the cases of those handlers that need more: blocks with attestations,
# attestation or attester_slashing steps, execution_payload steps or payload vote checks
# (from the consensus-specs v1.7.0-beta.4 pyspec sources). A new case of a run handler is
