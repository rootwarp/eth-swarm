# Skip list for crates/spec-tests (schema: testing/skip.toml.example).
# The run FAILS on any case that is neither run nor matched here, on an expired entry,
# and on an entry that matches nothing in a vector set that was scanned.
# The coverage guard also FAILS the run on any vector file that no handler read, unless its
# case is skipped here or a `file` entry excuses it.

[[skip]]
source  = "consensus-specs"
fork    = "*"
preset  = "*"
runner  = "ssz_static"
handler = "DataColumnSidecar"
reason  = "Data-column containers and their compute_max_data_column_sidecar_size() bound are defined with the column work, not in consensus-types yet"
owner   = "ian"
issue   = "M1-ssz-static-coverage"
expires = "2026-11-30"

