[package]
name = "devnet-probe"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The probe's acceptance checks against the reference CLs of a local Kurtosis devnet: discv5 discovery, TCP + Noise + yamux, Status v2 both ways with a held connection, and one finalized epoch by BlocksByRange against the beacon API's roots."

[[bin]]
name = "devnet-probe"
path = "src/main.rs"

[features]
# The stand-in reference CLs and the fixture beacon API (`fixtures`), for this crate's tests
# (the binary's included); built on testkit's fixture server and fixture devnet, and on cl-p2p's
# fixtures for the address that refuses every dial.
test-support = ["testkit/test-support", "cl-p2p/testkit"]

[dependencies]
# The probe swarm, its req/resp and range requester (cl-p2p), our discv5 (cl-discv5) and probe
# mode's Status provider (cl-chain) meet here: cl-p2p links neither discv5 nor cl-chain
# (scripts/check-m2a-deps.sh), and testkit, which cl-chain's tests use, links neither.
cl-p2p = { path = "../cl-p2p" }
cl-discv5 = { path = "../cl-discv5" }
cl-chain = { path = "../cl-chain" }
# serve: probe mode's column store, and cl-chain's chain.v1 socket (ipc's bind, connector and
# method ACL) that cl-p2p's column responders call; the versions cl-chain and cl-p2p use.
cl-chain-columns = { path = "../cl-chain-columns" }
ipc = { path = "../ipc" }
ethswarm-proto = { path = "../ethswarm-proto" }
tonic.workspace = true
tokio-stream = { version = "0.1", features = ["net"] }
ethereum_ssz.workspace = true
# The beacon API client (collector's HTTP/1.1 GET, the loopback URL rule).
testkit = { path = "../testkit" }
consensus-types = { path = "../consensus-types" }
network-config = { path = "../network-config" }
p2p-wire = { path = "../p2p-wire" }
# The versions cl-p2p, cl-discv5 and testkit already use.
libp2p = { workspace = true, features = ["secp256k1"] }
futures = "0.3"
prometheus-client = "0.25.1"
tokio = { version = "1", features = ["rt", "macros", "time", "net", "sync"] }
tracing = "0.1"
# The JSON logs on stderr through the bounded writer (`svc_runtime::telemetry`), as the service
# binaries log; already in the tree through cl-p2p.
svc-runtime = { path = "../svc-runtime" }
serde = { version = "1", features = ["derive"] }
hex = "0.4"

[dev-dependencies]
devnet-probe = { path = ".", features = ["test-support"] }
# The fixture devnet's helpers (ipc::testkit::devnet): network files written with mode 0644.
ipc = { path = "../ipc", features = ["testkit"] }
# The stand-in reference CL that serves blocks: cl-p2p's scripted loopback peer.
cl-p2p = { path = "../cl-p2p", features = ["testkit"] }
p2p-wire = { path = "../p2p-wire", features = ["testkit"] }
testkit = { path = "../testkit", features = ["test-support"] }
tree_hash.workspace = true
tempfile = "3"
# tests/chain_service.rs: temp directories with no symlink on their path (owned::testkit), for
# the column store's parent check.
svc-runtime = { path = "../svc-runtime", features = ["testkit"] }
# The stalled-stderr test fills a pipe without blocking (`fcntl` O_NONBLOCK).
rustix = { version = "1", features = ["fs"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync", "test-util"] }
