[package]
name = "cl-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "cl-api: the Beacon API on HTTP (node and config routes) and the ethswarm.api.v1 service (contract layer only, every RPC answers UNIMPLEMENTED)."

[dependencies]
# The Beacon API server: axum 0.8 on hyper 1, already in the tree through tonic (svc-runtime
# names it too). `tokio` and `http1` give `axum::serve`; `json`, `query` and `form` stay off,
# since they would add serde_path_to_error and serde_urlencoded to Cargo.lock. Pending Vera's
# review of the new direct deps before first use.
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
ethswarm-proto = { path = "../ethswarm-proto" }
# The `syncing_status` query parameter; already in Cargo.lock (through url).
form_urlencoded = "1"
http = "1"
# The server's connections: auto::Builder, TokioTimer and TowerToHyperService, as
# svc-runtime's /metrics server. Already in Cargo.lock (through axum and tonic).
hyper-util = { version = "0.1", features = ["http1", "server", "service", "tokio"] }
ipc = { path = "../ipc" }
network-config = { path = "../network-config" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
svc-runtime = { path = "../svc-runtime" }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tonic.workspace = true
tracing = "0.1"

[dev-dependencies]
# The end-to-end test of /eth/v1/events: cl-chain's own EventsService and its event types.
# Workspace crates; they add no crate to Cargo.lock.
cl-chain = { path = "../cl-chain" }
consensus-types = { path = "../consensus-types" }
# A streaming body for the server tests; already in Cargo.lock (through axum).
futures-util = { version = "0.3", default-features = false }
# The test SSE client: hyper's HTTP/1 client, as cl-chain's reference API client uses it.
# Already in Cargo.lock.
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
ipc = { path = "../ipc", features = ["testkit"] }
tempfile = "3"
tokio = { version = "1", features = ["io-util"] }
# A Unix socket served behind a method ACL (tonic's incoming stream); already in Cargo.lock.
tokio-stream = { version = "0.1", features = ["net"] }
tower = { version = "0.5", features = ["util"] }
