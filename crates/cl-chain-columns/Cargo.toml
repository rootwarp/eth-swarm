[package]
name = "cl-chain-columns"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# Seams for tests only: `ColumnWriter::set_before_commit`, a hook that runs in every column
# write transaction after its puts and before its commit, so a test can kill the writer
# mid-write; and `ColumnWriter::put_legacy_pending_link`, a link row in the layout stores wrote
# before, for a reader of an env not migrated yet. Only cl-chain's dev-dependencies enable it,
# so a normal build of a service leaves it off; `--all-features` (or a dependent's tests in the
# same build) turns it on, so release artifacts come from per-service builds without it.
test-hooks = []

[dependencies]
# MPL-2.0, unmodified. Builds the native mdbx-sys 12.13.2. Exact pin: bumps need a dependency review.
libmdbx = "=0.5.6"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
# Same crate libmdbx links; tests read env flags and options straight from the C API.
mdbx-sys = "=12.13.2"
proptest = "1"
tempfile = "3"
