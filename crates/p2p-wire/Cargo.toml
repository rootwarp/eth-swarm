[package]
name = "p2p-wire"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Eth2 wire format: req/resp ssz_snappy chunk framing, response codes, context bytes and messages; gossip topics, the bounded snappy transform and message-id. No libp2p, so it stays cheap to build and fuzz."

[features]
# Fixtures for this crate's tests and its users' tests: a Fulu + Gloas ContextTable and small blocks.
testkit = []

[dependencies]
consensus-types = { path = "../consensus-types" }
# Fork versions, epochs and the BPO-aware digest schedule the ENR fork fields are built from.
network-config = { path = "../network-config" }
ethereum_ssz.workspace = true
ethereum_ssz_derive.workspace = true
ssz_types.workspace = true
typenum.workspace = true
snap = "1"
# The gossip message-id (SHA256); already in the tree at this version.
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
p2p-wire = { path = ".", features = ["testkit"] }
