[package]
name = "network-config"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Pinned eth-clients network configs, the Fulu/Gloas fork schedule and blob parameters."

[dependencies]
sha2 = "0.10"
thiserror = "2"
# The network files are opened with O_NOFOLLOW | O_NONBLOCK and their owner is checked against
# the effective UID (geteuid): the version and features node-key and svc-runtime use, already in
# Cargo.lock.
rustix = { version = "1", features = ["fs", "process"] }

[dev-dependencies]
proptest = "1"
