[package]
name = "cl-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "cl-store: the ethswarm.store.v1 service, the read side of the store env (MDBX opened read-only)."

[features]
# Seam for other crates' tests only: `Reader::over`, a reader of an env this process already
# has open (cl-p2p's tests/byrange_serve.rs serves cl-store and cl-chain over one env). Only
# dev-dependencies enable it, so a normal build of the service leaves it off.
test-hooks = []

[dependencies]
ethswarm-proto = { path = "../ethswarm-proto" }
ipc = { path = "../ipc" }
# MPL-2.0, unmodified; the version store-schema pins. Read transactions and their errors.
libmdbx = "=0.5.6"
# The follower's gauges and the reopen counter, as svc-runtime's /metrics serves them. The
# version svc-runtime and cl-verify use; already in Cargo.lock.
prometheus-client = "0.25.1"
# The `[store]` table (`settings`). Already in Cargo.lock.
serde = { version = "1", features = ["derive"] }
# The env's options, tables, keys and stamp; opened only through `env::open_reader`.
store-schema = { path = "../store-schema" }
# The `[store]` table through the service config (`Config::section`).
svc-runtime = { path = "../svc-runtime" }
thiserror = "2"
# `spawn_blocking` for every MDBX read, the channel of a streamed walk, and the follower's
# task: its backoff sleeps and its select on the stop.
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tokio-stream = "0.1"
tonic.workspace = true
prost.workspace = true
tracing = "0.1"

[dev-dependencies]
# The follower's tests subscribe to cl-chain's own EventsService (its `events` source) over a
# Unix socket. A workspace crate: it adds no crate to Cargo.lock.
cl-chain = { path = "../cl-chain" }
ipc = { path = "../ipc", features = ["testkit"] }
network-config = { path = "../network-config" }
# test-hooks: tests stand in for cl-chain (`env::test_writer`, `txn::seed_unstamped`) and read
# through the writer's own env (`WriterEnv::raw_env`): one process cannot open an env twice.
store-schema = { path = "../store-schema", features = ["test-hooks"] }
# Same crate libmdbx links; `cannot_write` tries writes straight through the C API.
mdbx-sys = "=12.13.2"
tempfile = "3"
# test-util: a stalled GetBlocksByHead stream's tests run on a paused clock.
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "test-util"] }
# cl-chain's EventsService served on a Unix socket (tonic's incoming stream).
tokio-stream = { version = "0.1", features = ["net"] }
# Real blocks from store-schema's tests/common, built and encoded in code (no spec vectors).
alloy-primitives.workspace = true
consensus-types = { path = "../consensus-types" }
ethereum_ssz.workspace = true
ssz_types.workspace = true
tree_hash.workspace = true
