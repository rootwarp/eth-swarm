[package]
name = "cl-p2p"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "cl-p2p: the ethswarm.p2p.v1 service (stub: contract layer only, every RPC answers UNIMPLEMENTED), the outbound req/resp codec and the pinned-peer m2a-session."
# build.rs embeds what the m2a fuzz gate must hold for the decoders it is built from.
build = "build.rs"

[features]
# Fixtures for this crate's tests: a loopback libp2p peer that answers Status v2.
testkit = ["p2p-wire/testkit"]
# Builds the test binary m2a-session-test (below), which passes test_build = true to the
# m2a-session pre-flight: it takes a run_as other than m2a-session, keeps that user's groups and
# accepts a config the test user owns, so the integration tests can run it as the developer's
# user. Only cl-p2p's own dev-dependency turns it on. The feature changes no code of the library
# or of m2a-session, which always passes test_build = false, whatever is built with it.
test-run-as = []
# Builds the test binary cl-p2p-test (below): the same code as cl-p2p, but it reads its config
# from $CL_P2P_TEST_CONFIG, accepts a config and a topic list that the test user owns and lets
# the OS pick the /metrics port. Only cl-p2p's own dev-dependency turns it on; the cl-p2p
# binary never reads the variable.
test-config = []

# The test binary of the session: the same code as m2a-session with test_build = true. Built
# only with the test-run-as feature; its unit tests are m2a-session's, so it has none of its own.
[[bin]]
name = "m2a-session-test"
path = "src/bin/m2a-session-test/main.rs"
required-features = ["test-run-as"]
test = false

# The test binary of the service, built only with test-config. Its unit tests are cl-p2p's.
[[bin]]
name = "cl-p2p-test"
path = "src/bin/cl-p2p-test.rs"
required-features = ["test-config"]
test = false

[dependencies]
ethswarm-proto = { path = "../ethswarm-proto" }
ipc = { path = "../ipc" }
p2p-wire = { path = "../p2p-wire" }
consensus-types = { path = "../consensus-types" }
# `hash_tree_root` of the blocks the session fetches: consensus-types derives `TreeHash` but does
# not re-export the trait. Already in the tree through consensus-types, at the pinned rev.
tree_hash.workspace = true
# compute_fork_digest and the pinned Sepolia config, for the Status the session sends.
network-config = { path = "../network-config" }
# secp256k1: Ethereum node keys are secp256k1 (the peer ID must map to a discv5 node ID).
libp2p = { workspace = true, features = ["secp256k1"] }
libp2p-mplex.workspace = true
# `p2p_conn_budget_exceeded_total`; the version cl-verify and svc-runtime use, already in the
# tree through libp2p's `metrics` feature.
prometheus-client = "0.25.1"
tonic.workspace = true
futures = "0.3"
# `sync`: the bounded IGNORE queues (`rpc::limits`), already built through ipc.
tokio = { version = "1", features = ["rt", "macros", "time", "net", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
# The binaries' logging: JSON lines through the bounded stderr writer (a stalled stderr drops
# lines, never blocks the session) and the bounded flush before each exit. Also the owner walk
# that m2a-session reads its config through (svc_runtime::owned), which every service shares.
svc-runtime = { path = "../svc-runtime" }
rustix = { version = "1", features = ["fs", "process"] }
# getpwnam_r for the m2a-session pre-flight (m2a_session::os_user): the UID of the run_as user,
# through the system's name service. rustix has no getpwnam. The version already in the
# dependency graph (through tokio, socket2 and others), so no new crate; the one call is the
# crate's only unsafe code.
libc = "0.2.190"
thiserror = "2"
# Wipes the node-key bytes read from a key file on every path.
zeroize = "1"
# The service's node key from the systemd credential `nodekey` (src/identity.rs).
node-key = { path = "../node-key" }
# The m2a-session config (/etc/ethswarm/m2a-session.toml); the same versions svc-runtime uses.
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# `http::Uri` checks reference_api_url. The reference beacon API client is hyper 1 over plain
# TCP (localhost or an SSH tunnel); the same versions svc-runtime and cl-sync use, all already
# in the tree through tonic.
http = "1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
# Beacon API JSON, the m2a fuzz gate file and the session's JSON log line.
serde_json = "1"
# base64url of the reference node's ENR (`/eth/v1/node/identity`); already in the tree through
# multiaddr.
data-encoding = "2"

[dev-dependencies]
# test-run-as: the integration tests run the test binary m2a-session-test.
cl-p2p = { path = ".", features = ["testkit", "test-run-as", "test-config"] }
# owned::testkit: temp directories with no symlink on their path, for the owner walk.
svc-runtime = { path = "../svc-runtime", features = ["testkit"] }
ipc = { path = "../ipc", features = ["testkit"] }
# The mock reference beacon API: plain HTTP/1.1 on 127.0.0.1.
hyper = { version = "1", features = ["server", "http1"] }
p2p-wire = { path = "../p2p-wire", features = ["testkit"] }
tokio = { version = "1", features = ["rt", "macros", "time", "net", "test-util"] }
tempfile = "3"
ethereum_ssz.workspace = true
bs58 = "0.5"
# limits::outbound_semaphore_proptest; the version cl-verify-cache already uses.
proptest = "1"
# gossip::tests::custody_columns: cl-chain's custody column store behind the ignore-all
# gossipsub, on a temp column env. Test-only: the binaries link no store
# (scripts/check-m2a-deps.sh reads the normal dependencies).
cl-chain = { path = "../cl-chain" }
cl-chain-columns = { path = "../cl-chain-columns" }
