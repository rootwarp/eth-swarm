[package]
name = "testkit"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Capture and replay tooling for live-network runs: the gossip/SSE arrival collector, the block/column archiver with a verified sha256 manifest, the devnet block and root export, and genesis replay of that export. Never links cl-sync."

[[bin]]
name = "archiver"
path = "src/bin/archiver.rs"

[[bin]]
name = "collector"
path = "src/bin/collector.rs"

[[bin]]
name = "export-blocks"
path = "src/bin/export-blocks.rs"

[[bin]]
name = "replay"
path = "src/bin/replay.rs"
required-features = ["replay"]

[features]
# For this crate's tests and its users' tests: write-fault injection (`archive::Fault`: an
# interrupted write, a full disk), payload fixtures (`archive::fixtures`), and the collector's
# scripted clock and fixture beacon node (`collector::testing`, a hyper server on 127.0.0.1), and
# the export's fixture devnet (`export_blocks::fixtures`).
test-support = ["p2p-wire/testkit", "dep:ssz_types", "hyper/server"]
# Genesis replay. Not a default: cl-chain's dev-dependency on this crate must not pull
# `crypto-bls/verify` (scripts/check-cl-chain-features.sh). `cargo run --bin replay` turns it on.
replay = ["dep:crypto-bls", "dep:state-transition"]

[dependencies]
consensus-types = { path = "../consensus-types" }
network-config = { path = "../network-config" }
# In-process BLS for genesis replay (`crypto-bls` verify + aggregate), feature `replay` only.
# Sign stays off this crate: scripts/check-bls-features.sh allows `test-vectors` on spec-tests only.
crypto-bls = { path = "../crypto-bls", optional = true, features = ["verify", "aggregate"] }
# The pure Gloas transition, feature `replay` only. `testing` is a dev-dependency only.
state-transition = { path = "../state-transition", optional = true }
# `max_compressed_len`, the gossip snappy bound.
p2p-wire = { path = "../p2p-wire" }
tree_hash.workspace = true
# Gossip payloads are snappy block-compressed SSZ; the same crate p2p-wire frames req/resp with.
snap = "1"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
# The collector's SSE client for a reference node's /eth/v1/events: hyper 1 over plain TCP to a
# loopback host (localhost or an SSH tunnel), the same crates and versions cl-p2p's m2a-session
# reference API client uses, all already in the tree through tonic. No new HTTP client crate.
tokio = { version = "1", features = ["rt", "macros", "net", "time", "sync", "signal"] }
http = "1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
# The URL file's O_NOFOLLOW | O_NONBLOCK open and geteuid, for its owner check. The version and
# features cl-p2p and node-key use; no new crate.
rustix = { version = "1", features = ["fs", "process"] }
# Arrival records, gaps and NTP samples are JSON lines; beacon API and SSE event bodies are JSON.
serde_json = "1"
# SSZ of the genesis state and of blocks. Also used by the `test-support` fixtures.
ethereum_ssz.workspace = true
ssz_types = { workspace = true, optional = true }

[dev-dependencies]
testkit = { path = ".", features = ["test-support", "replay"] }
tempfile = "3"
# The replay fixture chain (tests/support/chain.rs): real validator keys and the test inputs
# (`genesis_state`, `bid_for_state`). `testing` is dev-only (scripts/check-stf-testing.sh).
state-transition = { path = "../state-transition", features = ["testing"] }
# `SecretKey::key_gen` and `sign` for that fixture. blst is already the workspace BLS library
# (crypto-bls); this dev-dependency does not enable crypto-bls `test-vectors`.
blst.workspace = true
crypto-bls = { path = "../crypto-bls", features = ["verify", "aggregate"] }
consensus-types = { path = "../consensus-types" }
network-config = { path = "../network-config" }
ethereum_ssz.workspace = true
tree_hash.workspace = true
tokio = { version = "1", features = ["rt", "macros", "net", "time", "sync"] }
