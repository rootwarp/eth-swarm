[package]
name = "ipc"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Service-to-service contract layer: Hello negotiation, stream framing, seq, envelope checks, error mapping, Unix-socket peer authentication and method ACLs, and the contract test kit."

[features]
# The contract suite (`ipc::testkit`): in-process and Unix-socket transports, probes, scripted peers.
testkit = ["tokio/rt-multi-thread", "dep:tempfile", "dep:prost-types", "dep:tonic-prost"]

[dependencies]
ethswarm-proto = { path = "../ethswarm-proto" }
network-config = { path = "../network-config" }
consensus-types = { path = "../consensus-types" }
tonic.workspace = true
prost.workspace = true
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net"] }
tokio-stream = { version = "0.1", features = ["net"] }
thiserror = "2"
# OS RNG for stream generations; SHA-256 for fence item hashes (both already in Cargo.lock).
getrandom = "0.3"
sha2 = "0.10"
tracing = "0.1"
# The UDS connector hands tonic a peer-checked stream, and the ACL is a tower layer over http.
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }
http = "1"
# openat/fstatat/unlinkat/fchownat/flock, a non-blocking connect probe and geteuid for the
# socket directory (`uds`): safe wrappers, already in the dependency graph through tempfile, so
# no libc of our own.
rustix = { version = "1", features = ["fs", "net", "process"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tempfile = { version = "3", optional = true }
prost-types = { workspace = true, optional = true }
tonic-prost = { workspace = true, optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "test-util", "io-util"] }
tempfile = "3"
# tests/fence.rs runs through the contract test kit (in process and over UDS).
ipc = { path = ".", features = ["testkit"] }

# Root-only tests switch one thread's credentials to play another user (Linux only).
[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { version = "1", features = ["fs", "net", "process", "thread"] }
