[package]
name = "ipc"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Service-to-service contract layer: Hello negotiation, stream framing, seq, envelope checks, error mapping, and the contract test kit."

[features]
# The contract suite (`ipc::testkit`): in-process and Unix-socket transports, probes, scripted peers.
testkit = ["tokio/rt-multi-thread", "dep:tempfile", "dep:hyper-util", "dep:tower", "dep:prost-types", "dep:tonic-prost", "dep:http"]

[dependencies]
ethswarm-proto = { path = "../ethswarm-proto" }
network-config = { path = "../network-config" }
consensus-types = { path = "../consensus-types" }
tonic.workspace = true
prost.workspace = true
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net"] }
tokio-stream = { version = "0.1", features = ["net"] }
thiserror = "2"
tracing = "0.1"
tempfile = { version = "3", optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
prost-types = { workspace = true, optional = true }
tonic-prost = { workspace = true, optional = true }
http = { version = "1", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }
