[package]
name = "cl-discv5"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "cl-discv5: discv5 peer discovery with the eth2/cgc/nfd ENR, and the ethswarm.discv5.v1 service (stub: contract layer only, every RPC answers UNIMPLEMENTED)."

[features]
# Builds the test binary cl-discv5-test (below): the same code as cl-discv5, but it reads its
# config from $CL_DISCV5_TEST_CONFIG, accepts a config that the test user owns and lets the OS
# pick the /metrics port. Only cl-discv5's own dev-dependency turns it on.
test-config = []

# The test binary of the service, built only with test-config.
[[bin]]
name = "cl-discv5-test"
path = "src/bin/cl-discv5-test.rs"
required-features = ["test-config"]
test = false

[dependencies]
ethswarm-proto = { path = "../ethswarm-proto" }
ipc = { path = "../ipc" }
tonic.workspace = true
# The ENR values (eth2, cgc, nfd) as bytes and the BPO-aware local fork fields.
p2p-wire = { path = "../p2p-wire" }
# FindPeers: a peer's custody columns from its node ID and `cgc` (das::custody_columns); already
# in the tree through p2p-wire.
consensus-types = { path = "../consensus-types" }
# No `libp2p` feature: every libp2p* crate comes from the one pinned rust-libp2p commit, and
# discv5's would be the crates.io one (scripts/check-libp2p-revs.sh).
discv5.workspace = true
enr.workspace = true
# The RLP string values of the record; already in the tree through discv5 and enr.
alloy-rlp = "0.3"
# The event stream discv5 hands out is a tokio mpsc receiver; the table sweep is a spawned task
# on an interval.
tokio = { version = "1", features = ["sync", "rt", "time", "macros"] }
# The table-eviction counter, on the service's registry; the version the other services use.
prometheus-client = "0.25.1"
thiserror = "2"
# The node key, from the systemd credential `nodekey` only (checks, zeroizing, redaction); the
# binary loads it, `enr::signing_key` turns it into the record's key. Logs on stderr.
node-key = { path = "../node-key" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
# The binary: the config from /etc/ethswarm/cl-discv5.toml (read only if root owns it and its
# path), the socket, the method ACL, /metrics, JSON logs through the bounded stderr writer (a
# stalled stderr drops lines, never blocks it) and the SIGTERM drain.
svc-runtime = { path = "../svc-runtime" }
# The network's fork schedule and genesis for the record's fork fields at the wall clock.
network-config = { path = "../network-config" }
# The [discv5] table; WatchPeers' response stream. Both already in the tree.
serde = { version = "1", features = ["derive"] }
tokio-stream = "0.1"

[dev-dependencies]
# test-config: tests/service.rs runs the test binary cl-discv5-test.
cl-discv5 = { path = ".", features = ["test-config"] }
ipc = { path = "../ipc", features = ["testkit"] }
# owned::testkit: temp directories with no symlink on their path, for the owner walk.
svc-runtime = { path = "../svc-runtime", features = ["testkit"] }
# test-util: FindPeers' deadline and lookup-bound tests run on a paused clock.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "test-util"] }
tempfile = "3"
# The node key's encodings the binary test greps its output for; already in the tree.
data-encoding = "2"
# The binary test's full stderr pipe (O_NONBLOCK while it fills); the version cl-p2p uses.
rustix = { version = "1", features = ["fs", "process"] }
