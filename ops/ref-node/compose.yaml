# Reference node: Reth (EL) and Lighthouse (CL) on the .env's NETWORK (sepolia or hoodi), the
# M2-alpha static peer and Beacon API oracle on Sepolia and the capture host's node on Hoodi.
# Runbook: README.md. Values come from the .env (copy .env.example or .env.hoodi.example;
# setup.sh writes the ids and DATA_ROOT; preflight.sh checks it all before `docker compose
# -p <network>-ref --env-file <it> up -d`). Each network is its own project (<network>-ref;
# always pass -p, which wins over a stray COMPOSE_PROJECT_NAME), so two run side by side on
# one host with their own .env, DATA_ROOT, users and ports.
#
# - network_mode: host (Linux only), so 127.0.0.1 is the host's loopback: the Engine API
#   (ENGINE_PORT) and the Beacon API (BEACON_API_PORT) are bound there and nowhere else, and
#   `ss -ltnp` on the host shows the real binds. p2p: reth RETH_P2P_PORT tcp/udp; lighthouse
#   LIGHTHOUSE_P2P_PORT tcp/udp and LIGHTHOUSE_QUIC_PORT udp.
# - Each service runs as its own OS user (setup.sh), on a read-only root filesystem with no
#   capabilities, no-new-privileges and its own cgroup namespace (a cgroup v1 host would
#   otherwise share the host's), and mounts only its own data directory and its own read-only
#   copy of the JWT secret. Bind sources are never created by docker: a missing directory or
#   secret fails the start instead of appearing root-owned.
# - No HTTP, WS or IPC RPC on reth; the Engine API is its only RPC.
name: ${NETWORK:?set NETWORK in .env}-ref

x-hardening: &hardening
  network_mode: host
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=256m
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  cgroup: private
  restart: unless-stopped
  environment:
    HOME: /tmp
  logging:
    driver: json-file
    options:
      max-size: 100m
      max-file: "5"

services:
  reth:
    <<: *hardening
    image: ${RETH_IMAGE:?set RETH_IMAGE in .env}
    user: "${RETH_UID:?run setup.sh}:${RETH_GID:?run setup.sh}"
    # Reth flushes its database on SIGTERM; give it time rather than SIGKILL mid-write.
    stop_grace_period: 5m
    volumes:
      - type: bind
        source: ${DATA_ROOT:?run setup.sh}/reth/data
        target: /data
        bind: {create_host_path: false}
      - type: bind
        source: ${DATA_ROOT:?run setup.sh}/reth/jwt.hex
        target: /secrets/jwt.hex
        read_only: true
        bind: {create_host_path: false}
    # The image's entrypoint is the reth binary; each list item is one argument, so an .env
    # value can never become a second flag. --full: pruned (the default is an archive node).
    # File logs off: docker's json-file log is the log. discv5 off: discv4 on RETH_P2P_PORT/udp
    # is enough, and keeps the firewall list to the ports README.md names.
    command:
      - node
      - --chain=${NETWORK:?set NETWORK in .env}
      - --full
      - --datadir=/data
      - --authrpc.addr=127.0.0.1
      - --authrpc.port=${ENGINE_PORT:?set ENGINE_PORT in .env}
      - --authrpc.jwtsecret=/secrets/jwt.hex
      - --port=${RETH_P2P_PORT:?set RETH_P2P_PORT in .env}
      - --discovery.port=${RETH_P2P_PORT:?set RETH_P2P_PORT in .env}
      - --disable-discv5-discovery
      - --ipcdisable
      - --log.file.max-files=0

  lighthouse:
    <<: *hardening
    image: ${LIGHTHOUSE_IMAGE:?set LIGHTHOUSE_IMAGE in .env}
    user: "${LIGHTHOUSE_UID:?run setup.sh}:${LIGHTHOUSE_GID:?run setup.sh}"
    stop_grace_period: 2m
    depends_on:
      - reth
    environment:
      HOME: /tmp
      NETWORK: ${NETWORK:?set NETWORK in .env}
      ENGINE_PORT: ${ENGINE_PORT:?set ENGINE_PORT in .env}
      BEACON_API_PORT: ${BEACON_API_PORT:?set BEACON_API_PORT in .env}
      LIGHTHOUSE_P2P_PORT: ${LIGHTHOUSE_P2P_PORT:?set LIGHTHOUSE_P2P_PORT in .env}
      LIGHTHOUSE_QUIC_PORT: ${LIGHTHOUSE_QUIC_PORT:?set LIGHTHOUSE_QUIC_PORT in .env}
      CHECKPOINT_SYNC_URL: ${CHECKPOINT_SYNC_URL:?set CHECKPOINT_SYNC_URL in .env}
      TRUSTED_PEERS: ${TRUSTED_PEERS:-}
    volumes:
      - type: bind
        source: ${DATA_ROOT:?run setup.sh}/lighthouse/data
        target: /data
        bind: {create_host_path: false}
      - type: bind
        source: ${DATA_ROOT:?run setup.sh}/lighthouse/jwt.hex
        target: /secrets/jwt.hex
        read_only: true
        bind: {create_host_path: false}
    # The image has no entrypoint, and --trusted-peers must be left out entirely when
    # TRUSTED_PEERS is empty (Lighthouse refuses an empty peer list), which a fixed argv cannot
    # do. So the image's own bash adds it only when set, then execs Lighthouse (PID 1, signals
    # reach it). Values arrive in the environment and are quoted, so a URL's ? or & is never
    # split or interpreted, and no .env value is ever part of the script. $$ keeps compose
    # from interpolating them. umask 077: Lighthouse creates its node key
    # (data/beacon/network/key) 0600, not the container default 0644. --port sets the libp2p
    # TCP and discv5 UDP port; UPnP is off on a server. The checkpoint URL ends up on
    # Lighthouse's command line, which any local user reads in ps, so preflight.sh refuses one
    # whose credentials or path may hold a provider key; a keyed provider goes behind a local
    # proxy (README.md, Keyed checkpoint providers).
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        umask 077 &&
        exec lighthouse bn
        --network "$$NETWORK"
        --datadir /data
        --execution-endpoint "http://127.0.0.1:$$ENGINE_PORT"
        --execution-jwt /secrets/jwt.hex
        --http --http-address 127.0.0.1 --http-port "$$BEACON_API_PORT"
        --port "$$LIGHTHOUSE_P2P_PORT"
        --quic-port "$$LIGHTHOUSE_QUIC_PORT"
        --disable-upnp
        --checkpoint-sync-url "$$CHECKPOINT_SYNC_URL"
        $${TRUSTED_PEERS:+--trusted-peers "$$TRUSTED_PEERS"}
